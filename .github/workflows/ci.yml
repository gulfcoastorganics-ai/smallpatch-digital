name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Serve static site
        run: |
          python3 -m http.server 4173 >/tmp/smallpatch-http.log 2>&1 &
          echo $! >/tmp/smallpatch-http.pid
      - name: Smoke public pages
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/smallpatch-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/smallpatch-index.html
          curl --fail --silent --show-error http://127.0.0.1:4173/demo.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/thank-you.html >/dev/null
